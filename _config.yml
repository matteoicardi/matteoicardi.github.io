title: Dr. Matteo Icardi
description: Associate Professor in Applied Mathematics, University of Nottingham. Multiscale modelling, porous media, peatlands and scientific computing.
tagline:
  - Associate Professor in Applied Mathematics, University of Nottingham
  - Multiscale modelling · porous media · peatlands · scientific computing
theme: jekyll-theme-cayman

plugins:
  - jekyll-relative-links
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

navigation:
  - title: Home
    url: /index.html
  - title: Research
    url: /research.html
  - title: Peatlands
    url: /peat.html
  - title: Software
    url: /coding.html
  - title: PhD opportunities
    url: /phd.html
  - title: Funding & Partners
    url: /grants.html
  - title: Teaching
    url: /teaching.html

# Exclude unnecessary files from the build
exclude:
  - some_content.txt
  - .DS_Store
